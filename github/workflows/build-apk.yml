name: Build Jar Hero APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          set -e
          B=android/app/src/main
          mkdir -p $B/java/com/jarhero/app $B/assets $B/res/mipmap-xxxhdpi $B/res/values
          cp index.html $B/assets/index.html
          cp icon-192.png $B/res/mipmap-xxxhdpi/ic_launcher.png
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'JarHero'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.jarhero.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.jarhero.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > $B/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Jar Hero" android:icon="@mipmap/ic_launcher" android:theme="@style/AppTheme" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|uiMode" android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $B/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
              <item name="android:windowBackground">@color/bg</item>
            </style>
          </resources>
          EOF
          cat > $B/res/values/colors.xml <<'EOF'
          <resources><color name="bg">#0D1710</color></resources>
          EOF
          cat > $B/java/com/jarhero/app/MainActivity.java <<'EOF'
          package com.jarhero.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.parseColor("#0D1710"));
              getWindow().setNavigationBarColor(Color.parseColor("#0D1710"));
              w = new WebView(this);
              w.setBackgroundColor(Color.parseColor("#0D1710"));
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("file".equals(u.getScheme())) return false;
                  startActivity(new Intent(Intent.ACTION_VIEW, u));
                  return true;
                }
              });
              if (b == null) w.loadUrl("file:///android_asset/index.html"); else w.restoreState(b);
            }
            @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); w.saveState(o); }
            @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JarHero-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Jar Hero APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
