<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jar Hero</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap">
<style>
:root{--bg:#0d1710;--card:#16251a;--card2:#1f3326;--ink:#f2fff0;--mute:#9db8a2;--lime:#b6ff3c;--pur:#8f6bff;--pink:#ff4fa8;--yel:#ffd23f;--cy:#3fe0ff;--on:#0d1710;--line:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1fbe9;--card:#fff;--card2:#e6f6dc;--ink:#10210f;--mute:#4e6b52;--line:rgba(0,0,0,.1)}}
:root[data-theme="light"]{--bg:#f1fbe9;--card:#fff;--card2:#e6f6dc;--ink:#10210f;--mute:#4e6b52;--line:rgba(0,0,0,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Outfit','Avenir Next','Trebuchet MS',sans-serif;padding-bottom:110px;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:14px 16px}
h2{font-size:26px;font-weight:900;margin:6px 0 4px;letter-spacing:-.5px}
h3{font-size:17px;font-weight:800;margin:0 0 8px}
p{margin:0 0 10px;line-height:1.45;color:var(--mute)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top b{font-size:22px;font-weight:900;display:block;line-height:1}
.top span{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:16px;margin-bottom:14px}
.lime{background:var(--lime);color:var(--on);border-color:transparent}.lime p{color:rgba(13,23,16,.7)}
.pur{background:var(--pur);color:#fff;border-color:transparent}.pur p{color:rgba(255,255,255,.8)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.big{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.chip{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:800;background:var(--card2);color:var(--ink);transform:rotate(-2deg)}
.chip.y{background:var(--yel);color:var(--on)}.chip.k{background:var(--pink);color:#fff}
button{font:inherit;font-weight:800;border:none;border-radius:99px;padding:13px 20px;background:var(--card2);color:var(--ink);cursor:pointer;border:1.5px solid var(--line)}
button:active{transform:scale(.96)}
.go{background:var(--lime);color:var(--on);border-color:transparent}
.dk{background:var(--on);color:var(--lime);border-color:transparent}
.pk{background:var(--pink);color:#fff;border-color:transparent}
input,select{font:inherit;font-weight:600;color:var(--ink);background:var(--card2);border:1.5px solid var(--line);border-radius:18px;padding:13px 15px;min-width:0;flex:1;outline:none}
input:focus,button:focus-visible{outline:3px solid var(--cy)}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .5s}
.lime .bar{background:rgba(13,23,16,.18)}.lime .bar i{background:var(--on)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{border-radius:22px;padding:12px 4px;text-align:center;font-size:12px;font-weight:800;color:var(--on);border:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile svg{width:26px;height:26px}
.dots{display:flex;gap:8px;justify-content:space-between}
.dot{flex:1;text-align:center;font-size:11px;color:var(--mute);font-weight:700}
.dot i{display:block;width:100%;aspect-ratio:1;max-width:38px;margin:0 auto 4px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;color:var(--on);font-size:15px}
.dot.on i{background:var(--yel)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two ul{margin:0;padding-left:16px;font-size:13px;line-height:1.6;color:var(--mute)}
.itm{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.itm:first-of-type{border-top:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{aspect-ratio:1;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800;text-align:center;padding:6px;color:var(--on)}
.bd.off{background:var(--card2)!important;color:var(--mute);opacity:.7}.bd b{font-size:26px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:11px;color:var(--mute)}.chart i{display:block;border-radius:10px;background:var(--lime);min-height:4px;margin:3px 0}
.chk{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.chk:first-of-type{border-top:none}
.bx{flex:none;width:26px;height:26px;border-radius:9px;border:2.5px solid var(--lime);display:grid;place-items:center;color:var(--on);font-weight:900}
.chk.d .bx{background:var(--lime)}.chk.d span{opacity:.55;text-decoration:line-through}
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--bg)}
.ov.win{background:var(--lime);color:var(--on)}
.ov h1{font-size:54px;font-weight:900;line-height:.95;margin:0;letter-spacing:-2px;transform:rotate(-3deg)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--yel);color:var(--on);padding:11px 18px;border-radius:99px;font-weight:800;max-width:90%;text-align:center}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;width:min(420px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:99px;background:rgba(40,70,48,.45);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:1px solid rgba(255,255,255,.22);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);touch-action:none;user-select:none;-webkit-user-select:none}
#hl{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:99px;background:rgba(182,255,60,.28);border:1px solid rgba(182,255,60,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);will-change:transform;transition:transform .4s cubic-bezier(.22,1,.36,1)}
nav.drag #hl{transition:none}
nav{-webkit-touch-callout:none}
.fi{animation:fi .24s ease-out}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
nav .t{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:800;color:var(--mute)}
nav .t svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .t.on{color:var(--lime)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:360px){.big{font-size:36px}.tiles{gap:6px}}
</style></head>
<body>
<main id="app"></main>
<nav id="nav"><div id="hl"></div></nav>
<div id="layer"></div>

function cw(){return (document.getElementById('nav').clientWidth-12)/5}
function place(x,h){document.getElementById('hl').style.transform='translate3d('+x+'px,0,0) scale('+(h?1.1:1)+')'}
function mark(i){document.querySelectorAll('nav .t').forEach(function(e,j){e.classList.toggle('on',j==i)})}
function setNav(){var i=TABS.map(function(t){return t[0]}).indexOf(V);if(i<0)i=0;place(i*cw(),document.getElementById('nav').classList.contains('hold'));mark(i)}

(function(){var n=document.getElementById('nav');TABS.forEach(function(t,i){n.insertAdjacentHTML('beforeend','<div class="t" role="button" aria-label="'+t[1]+'"><svg viewBox="0 0 24 24"><path d="'+t[2]+'"/></svg>'+t[1]+'</div>')});
function px(x){var r=n.getBoundingClientRect(),w=cw();return Math.max(0,Math.min(4*w,x-r.left-7-w/2))}
function idx(x){return Math.max(0,Math.min(4,Math.round(px(x)/cw())))}
n.addEventListener('pointerdown',function(e){n._d=1;n.classList.add('hold','drag');try{n.setPointerCapture(e.pointerId)}catch(x){}place(px(e.clientX),1);mark(idx(e.clientX))});
n.addEventListener('pointermove',function(e){if(n._d){place(px(e.clientX),1);mark(idx(e.clientX))}});
function end(e){if(!n._d)return;n._d=0;var cur=TABS.map(function(t){return t[0]}).indexOf(V),i=e.type==='pointercancel'?cur:idx(e.clientX);n.classList.remove('drag','hold');if(i!==cur){V=TABS[i][0];render();window.scrollTo(0,0);var a=document.getElementById('app');a.classList.remove('fi');void a.offsetWidth;a.classList.add('fi')}else setNav()}
['pointerup','pointercancel'].forEach(function(t){n.addEventListener(t,end)})})();
